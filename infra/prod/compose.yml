# Production stack for matchpoint-prod. Lives at /opt/matchpoint/compose.yml on
# the VPS (installed by hand — see README.md); CI never edits it there, it only
# triggers deploy.sh over restricted SSH.
#
# Interpolated from /opt/matchpoint/.env:
#   IMAGE_TAG         — written by deploy.sh (commit short SHA)
#   POSTGRES_PASSWORD — set once at provisioning time
#
# The matchpoint/* images are never pulled: deploy.sh docker-loads them from
# tarballs in the GitLab package registry (the container registry port is
# firewalled off-campus), so the local names here match the tags CI bakes in.
#
# Memory limits keep any one service from consuming the whole (modest) VPS
# under load; Postgres gets the largest share.
# Docker's json-file driver is unbounded by default, so one chatty or
# crash-looping service can fill the disk — and Caddy logs every request. Docker
# fixes a container's logging at creation, so this only takes effect once
# containers are recreated, not on a restart.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Caddy runs as root because it binds :80/:443, and dropping the uid would not
  # protect the one secret here — it has to read the origin key whatever it runs
  # as. Stripping every capability but the port bind removes what
  # root-in-container is worth escalating to, without the port/ownership
  # coupling a non-root image would add.
  web:
    image: matchpoint/web:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
    depends_on:
      - api
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 256m

  api:
    image: matchpoint/api:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      MATCHPOINT_DATABASE_URL: postgresql+psycopg://matchpoint:${POSTGRES_PASSWORD:?}@postgres:5432/matchpoint
      # Reported by /health, which is how the pipeline's smoke check tells a
      # container that serves the tag just deployed from one still serving the
      # last. Without this the API reports "dev" and that check can never pass.
      MATCHPOINT_COMMIT: ${IMAGE_TAG:?}
      # The API's default sender writes the message to the log, which deployed
      # is a sign-up flow that looks alive and verifies nobody — so production
      # names the real one explicitly. :? refuses to start on an unset or empty
      # key, which is the right failure: an API up but unable to mail cannot
      # create an account at all.
      MATCHPOINT_EMAIL_SENDER: resend
      MATCHPOINT_RESEND_API_KEY: ${RESEND_API_KEY:?}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m

  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: matchpoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: matchpoint
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchpoint"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 768m
    shm_size: 128mb

volumes:
  postgres-data:
  caddy-data:
