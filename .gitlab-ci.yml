stages:
  - lint
  - test
  - build
  - deploy
  - verify

# Let GitLab's "auto-cancel redundant pipelines" kill superseded runs when new
# commits land on the same ref.
default:
  interruptible: true

# Run on merge requests and on the default branch, but avoid duplicate pipelines
# for branches that already have an open merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Every `changes:` filter below is paired with the merge-request source, because a
# branch pipeline has nothing to diff against: on a branch's first push
# CI_COMMIT_BEFORE_SHA is all zeroes, so `changes:` counts every file as changed and
# the whole pipeline runs whatever the commit touched. The window is narrow (the rule
# above retires branch pipelines once the merge request exists) but it is exactly when
# a batch of branches is pushed at once, and the runner has four slots.

# --- Shared job setup -------------------------------------------------------
# apps/api is a uv (Python) project; apps/web is a pnpm workspace member. The two
# toolchains never touch each other, hence two independent job families.

.api-base:
  # The 0.11 minor pin matches pyproject's uv required-version; the unversioned
  # *-bookworm-slim tags are frozen at uv 0.9, which can't read this lockfile.
  image: ghcr.io/astral-sh/uv:0.11-python3.12-trixie-slim
  variables:
    # Absolute, because before_script cds into apps/api while cache:paths are
    # resolved from the repo root — a relative path caches a directory that the
    # jobs never write to.
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  # The prefix is explicit so every job names this archive the same way. Without
  # one GitLab prefixes it with the entry's index in that job's cache list, so a
  # job listing it second looks for an archive nothing writes.
  cache:
    key:
      prefix: uv
      files:
        - apps/api/uv.lock
    paths:
      - .uv-cache
  before_script:
    - cd apps/api
    - uv sync --locked --group dev
  # Root config files affect both families and so appear in both filters.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/api/**/*
        - .gitlab-ci.yml

# Narrower than .web-base's filter on purpose. That list is sized for repo-wide
# Prettier/ESLint, which has to see a Markdown edit anywhere in the repo; these
# rules are for the jobs that only compile and run web app code, and nothing
# left out of them can change web runtime behaviour. web-lint still runs on the
# broad list, so repo-wide formatting stays enforced.
.web-app-rules: &web-app-rules
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      - apps/web/**/*
      - packages/**/*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .gitlab-ci.yml

.web-base:
  image: node:22-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    # Moves the store inside the project so cache:paths above can archive it.
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Prettier and ESLint run repo-wide from the root, so this list has to name
    # every file Prettier formats, not just web source — Markdown, YAML and JSON
    # anywhere in the repo included. A violation that skips web-lint merges
    # unchecked and then fails the next pipeline that does run one.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/web/**/*
        - packages/**/*
        - docs/**/*
        - infra/**/*
        - "**/*.md"
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - skills-lock.json
        - eslint.config.mjs
        - .prettierrc.json
        - .prettierignore
        - .editorconfig
        - .mcp.json
        - docker-compose.yml
        - .gitlab-ci.yml

# --- Jobs -------------------------------------------------------------------
# `needs:` makes this a DAG rather than a stage ladder, so the two families run
# as independent chains and every lint and test job starts at once. The `stages:`
# list above is then ordering documentation that keeps the pipeline graph
# readable, not a barrier.
#
# Note where the lint jobs sit: nothing depends on them until the image builds.
# A job with `needs:` runs as soon as its own needs are satisfied, regardless of
# what else in the pipeline failed, so hanging lint off the builds rather than
# off the test jobs is what keeps a failing lint from reaching deploy — while
# still letting the slow e2e job start immediately instead of queueing behind
# repo-wide Prettier.
#
# The build jobs' `needs:` use the `optional: true` long form because `rules:`
# lets jobs drop out independently, and a hard `needs:` on a job that was never
# created is a pipeline-config error rather than a skip.

python-lint:
  extends: .api-base
  stage: lint
  needs: []
  script:
    - uv run ruff check .
    - uv run ruff format --check .

web-lint:
  extends: .web-base
  stage: lint
  needs: []
  script:
    - pnpm run format:check
    - pnpm run lint

web-api-client:
  extends: .web-base
  stage: lint
  needs: []
  # apps/api's own suite fails on an openapi.json that no longer matches the
  # routes; this is the other half — a spec that was regenerated without the
  # client that is generated from it. Both are committed, and a client left
  # behind compiles fine against its own stale types, so nothing else notices.
  #
  # Node-only, since the spec is a committed file: no uv, no Postgres, no server.
  #
  # The spec file, not apps/api/**: it is the generator's only input from the API
  # side, so a route change that leaves openapi.json alone cannot change what this
  # job produces — and that case is api-test's, which fails on a spec the routes
  # have outgrown.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/api/openapi.json
        - packages/api-client/**/*
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .gitlab-ci.yml
  cache:
    policy: pull
  script:
    # Copied outside the project so the generator can't see it. `diff -r` rather
    # than `git diff --exit-code`: node:22-slim ships no git.
    - cp -r packages/api-client/src /tmp/api-client-committed
    - pnpm --filter @matchpoint/api-client run generate
    - >-
      diff -r /tmp/api-client-committed packages/api-client/src || { echo "The committed client is
      not what the spec generates — run scripts/gen-api-client.sh and commit the result."; exit 1; }

api-test:
  extends: .api-base
  stage: test
  needs: []
  # Integration tests run against real Postgres, matching the local `docker compose
  # up -d` setup. Tag pinned to the same major as docker-compose.yml and prod.
  # No `alias:` — GitLab derives the `postgres` hostname from the image name, and
  # setting it explicitly collides with that default rather than reinforcing it.
  services:
    - postgres:18
  variables:
    # Absolute for the same reason as UV_CACHE_DIR. pyright on PyPI is a shim
    # that downloads a Node build and npm-installs the real pyright into this
    # directory on first run, so caching it is worth more than caching uv's.
    PYRIGHT_PYTHON_ENV_DIR: $CI_PROJECT_DIR/.pyright-node
    # Job variables reach the service container too, which is how these three
    # configure the server the tests then connect to.
    POSTGRES_USER: matchpoint
    POSTGRES_PASSWORD: matchpoint
    POSTGRES_DB: matchpoint
    # The service is only reachable at its alias, so conftest's local-host guard
    # has to be waived explicitly — see tests/conftest.py. Only the database name
    # differs from what the tests use: conftest swaps in matchpoint_test itself.
    MATCHPOINT_DATABASE_URL: postgresql+psycopg://matchpoint:matchpoint@postgres:5432/matchpoint
    MATCHPOINT_TEST_ALLOW_NONLOCAL_DB: "1"
  # Spelled out rather than inherited: cache: is a list, so extends replaces it
  # wholesale. The uv entry is pull-only — python-lint already pushes it under
  # the same key — while the pyright env is only ever produced here. Keying it on
  # uv.lock invalidates it whenever the pyright pin moves.
  cache:
    - key:
        prefix: uv
        files:
          - apps/api/uv.lock
      paths:
        - .uv-cache
      policy: pull
    - key:
        prefix: pyright-node
        files:
          - apps/api/uv.lock
      paths:
        - .pyright-node
  script:
    # The Node build pyright fetches links against libatomic; ruff is a static
    # binary and doesn't, so this stays out of .api-base and off python-lint.
    - apt-get update -qq && apt-get install -y -qq libatomic1 > /dev/null
    - uv run pyright
    - uv run pytest --cov --junitxml=junit.xml
  # Matches the TOTAL line of pytest-cov's terminal report.
  coverage: '/TOTAL.*? (\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: apps/api/junit.xml

web-test:
  extends: .web-base
  stage: test
  needs: []
  rules: *web-app-rules
  # One at a time across pipelines. Each job runs under the runner's CPU quota, but
  # a saturated host still splits its cores across every running job, so two of
  # these together slow each other for no gain: docs/testing.md.
  resource_group: web-test
  # Pull-only: web-lint pushes this cache under the same lockfile-derived key,
  # so re-archiving the store here would upload nothing new. cache: is a map, so
  # extends merges this in on top of .web-base's key and paths.
  cache:
    policy: pull
  script:
    - pnpm run typecheck
    # Called via --filter rather than the root `test` script because the extra
    # `--recursive` layer swallows the reporter flags.
    - pnpm --filter @matchpoint/web run test --reporter=default --reporter=junit
      --outputFile=junit.xml --coverage
  # Matches the Statements line of the "Coverage summary" block, which the
  # text-summary reporter emits (enabled in apps/web/vite.config.ts).
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    reports:
      junit: apps/web/junit.xml

web-e2e:
  extends: .web-base
  stage: test
  # needs: [] deliberately — this is the longest job in the pipeline, so it
  # starts at t=0 rather than waiting for a lint stage it has no dependency on.
  needs: []
  # Spelled out rather than sharing *web-app-rules with web-test: the suite runs
  # against the real API (docs/testing.md), so apps/api and the script that boots
  # it are inputs to this job and to no other web one.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/web/**/*
        - apps/api/**/*
        - packages/**/*
        - scripts/e2e-api.sh
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - .gitlab-ci.yml
  # api-test's service and settings, since scripts/e2e-api.sh needs the same
  # server. It creates and migrates matchpoint_e2e itself, so only the database
  # named in the URL differs from what the API is handed here. Its local-host
  # guard needs the same waiver conftest's does, for the same reason.
  services:
    - postgres:18
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    # The API this job boots imports nothing from the dev group, and skipping it
    # drops ruff and pyright from the install. scripts/e2e-api.sh's own `uv run`
    # reads this too, so its implicit sync matches the one below.
    UV_NO_DEV: "1"
    POSTGRES_USER: matchpoint
    POSTGRES_PASSWORD: matchpoint
    POSTGRES_DB: matchpoint
    MATCHPOINT_DATABASE_URL: postgresql+psycopg://matchpoint:matchpoint@postgres:5432/matchpoint_e2e
    MATCHPOINT_TEST_ALLOW_NONLOCAL_DB: "1"
  # Both pull-only: web-lint pushes the pnpm store under its key and python-lint
  # pushes uv's under its own, so neither is produced here. cache: is a list, so
  # extends replaces .web-base's entry wholesale rather than merging.
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
      policy: pull
    - key:
        prefix: uv
        files:
          - apps/api/uv.lock
      paths:
        - .uv-cache
      policy: pull
  # The image tag must track @playwright/test in pnpm-lock.yaml. It ships the
  # browser builds that release expects, which is what the suite runs against:
  # pnpm doesn't execute the playwright postinstall that would otherwise
  # download them, so a mismatched tag fails looking for a browser revision the
  # image doesn't carry.
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  script:
    # The API runs in this container too (Playwright starts it), and this image
    # carries browsers rather than a Python toolchain. Pinned via astral's
    # per-version installer URL to the exact uv the api jobs' floating 0.11
    # image tag currently resolves to; bump both together.
    - curl -LsSf https://astral.sh/uv/0.11.33/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    # Build the venv here rather than leaving it to the first `uv run` inside
    # scripts/e2e-api.sh: Playwright allows that server 180s, which a cache-cold
    # install off a slow link does not fit into.
    - uv sync --locked --project apps/api
    - pnpm --filter @matchpoint/web run test:e2e
  artifacts:
    when: always
    # The HTML report is the point of a failed e2e run — it carries the traces
    # retries record, which the JUnit summary alone can't show.
    paths:
      - apps/web/playwright-report/
    reports:
      junit: apps/web/junit-e2e.xml

# --- Build & deploy ----------------------------------------------------------
# Image builds talk to the ThinkTank host's Docker daemon through the socket
# the runner mounts into job containers, so the layer cache persists between
# runs. Shipping and deploying are default-branch only; each image is uploaded
# as a docker-save tarball to the generic package registry (package "images",
# version = commit short SHA) — the container registry port (5050) is
# firewalled to campus-internal traffic, while the package registry rides the
# reachable HTTPS port. The tarball is written to disk before the upload so
# curl sends a Content-Length instead of a chunked body, and `docker save` and
# `gzip` are separate steps rather than a pipeline: the job runs under sh with
# no pipefail, so piping would report gzip's status and upload a truncated
# tarball with the job green.
#
# The two uploads go to one package version, differing only in filename, and the
# registry find-or-creates that version per upload — so two builds finishing in
# the same instant race to create it and the loser gets a 500. Hence the retry
# around the upload: by the next attempt the version the other job created
# exists. `retry:` on the job would re-run a four-minute build for a fault
# entirely in its last step, and a package per image would move the download
# path in infra/prod/deploy.sh, which lives on the VPS.

.image-base:
  stage: build
  image: docker:29-cli
  variables:
    PUSH_IMAGE: "true"
  # The daemon is shared with every other pipeline, and each build leaves an
  # immutable per-commit tag on it, so `docker image prune` frees nothing —
  # nothing is ever dangling — and the tags accumulate until the disk fills.
  # Bound the list explicitly, the way infra/prod/deploy.sh bounds it on the VPS,
  # keeping the newest few so the layer cache the next build reuses survives.
  # In after_script so that a failed build tidies up too, and so that a prune
  # which fails cannot redden an otherwise green job.
  after_script:
    - >-
      docker images "matchpoint/$IMAGE_NAME" --format '{{.Tag}}' | tail -n +6 | while read -r old;
      do docker rmi "matchpoint/$IMAGE_NAME:$old" || true; done

# Each build job spells out its own rules rather than sharing one on .image-base:
# the changes: list is per-image, so an apps/api commit doesn't rebuild the web
# image, and rules: is a list, which extends replaces rather than merges.
#
# Off the default branch, each builds without pushing whenever its own inputs
# change, so a broken build fails on the merge request instead of first being
# noticed as a main pipeline that leaves main undeployable. The whole of each app
# is an input, not just its Dockerfile: a bad import, a new dependency, or a
# lockfile bump breaks the build with the Dockerfile untouched.

build-api-image:
  extends: .image-base
  variables:
    IMAGE_NAME: api
  needs:
    - job: python-lint
      optional: true
    - job: api-test
      optional: true
  # No root .dockerignore here: the build context is apps/api, so Docker reads
  # apps/api/.dockerignore, which apps/api/**/* already covers.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/api/**/*
        - .gitlab-ci.yml
      variables:
        PUSH_IMAGE: "false"
  script:
    - docker build -t "matchpoint/api:$CI_COMMIT_SHORT_SHA" apps/api
    # CI_JOB_TOKEN is scoped to this pipeline run; no stored secret involved.
    - >-
      if [ "$PUSH_IMAGE" = "true" ]; then apk add --no-cache curl && docker save -o api.tar
      "matchpoint/api:$CI_COMMIT_SHORT_SHA" && gzip api.tar && attempt=1 && until curl
      --fail-with-body -sS -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file api.tar.gz
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/images/$CI_COMMIT_SHORT_SHA/api.tar.gz";
      do attempt=$((attempt + 1)); if [ "$attempt" -gt 3 ]; then exit 1; fi; echo "upload failed,
      retrying (attempt $attempt of 3)" >&2; sleep 5; done; fi

build-web-image:
  extends: .image-base
  variables:
    IMAGE_NAME: web
  needs:
    - job: web-lint
      optional: true
    - job: web-api-client
      optional: true
    - job: web-test
      optional: true
    - job: web-e2e
      optional: true
  # This image builds from the repo root, so the workspace manifests and the root
  # .dockerignore are inputs too.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/web/**/*
        - packages/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - .dockerignore
        - .gitlab-ci.yml
      variables:
        PUSH_IMAGE: "false"
  script:
    - docker build -f apps/web/Dockerfile -t "matchpoint/web:$CI_COMMIT_SHORT_SHA" .
    - >-
      if [ "$PUSH_IMAGE" = "true" ]; then apk add --no-cache curl && docker save -o web.tar
      "matchpoint/web:$CI_COMMIT_SHORT_SHA" && gzip web.tar && attempt=1 && until curl
      --fail-with-body -sS -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file web.tar.gz
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/images/$CI_COMMIT_SHORT_SHA/web.tar.gz";
      do attempt=$((attempt + 1)); if [ "$attempt" -gt 3 ]; then exit 1; fi; echo "upload failed,
      retrying (attempt $attempt of 3)" >&2; sleep 5; done; fi

deploy:
  stage: deploy
  image: alpine:3.22
  # Not optional, unlike the needs above: this job is default-branch-only, where
  # both builds always run, so a soft edge could only ever let a deploy fire for
  # a SHA whose tarball was never uploaded. Fail the pipeline instead.
  needs: [build-api-image, build-web-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Never auto-cancel a deploy mid-flight, and never run two concurrently.
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: https://matchpoint.thomaskabalin.com
  before_script:
    - apk add --no-cache openssh-client
  script:
    - chmod 600 "$SSH_PRIVATE_KEY"
    # The key is bound to a forced command on the VPS (infra/prod/deploy.sh),
    # so the "command" sent here is just the image tag to deploy. SSH goes to
    # the IP because the domain resolves to Cloudflare, not the origin.
    - ssh -i "$SSH_PRIVATE_KEY" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" deploy@REDACTED
      "$CI_COMMIT_SHORT_SHA"

# What "deployed" is allowed to mean. deploy.sh returns once compose has started
# the containers, which is a weaker claim than the site working: a crash-looping
# api, a web container still serving the previous tag, or a database that never
# came back all clear that bar. So ask production the way a browser would — the
# public name, through Cloudflare — and let the success alert wait on the answer.
smoke:
  stage: verify
  image: alpine:3.22
  needs: [deploy]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # The deploy it judges has already happened, so cancelling this would leave a
  # live deploy unverified and unannounced. As uninterruptible as deploy itself.
  interruptible: false
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      site="https://matchpoint.thomaskabalin.com"
      # Poll rather than ask once: compose returns before uvicorn is listening,
      # so a single request races the container it is meant to be checking. The
      # cache-buster is a query param because Cloudflare ignores a client's
      # Cache-Control header, and a cached /health would answer for the old build.
      deadline=$(($(date +%s) + 60))
      while :; do
        commit=$(curl -fsS --max-time 5 "$site/api/health?pipeline=$CI_PIPELINE_ID" | jq -r '.commit // empty' || true)
        if [ "$commit" = "$CI_COMMIT_SHORT_SHA" ]; then break; fi
        if [ "$(date +%s)" -ge "$deadline" ]; then
          echo "expected /health to report $CI_COMMIT_SHORT_SHA, got '${commit:-nothing}'" >&2
          echo "an older tag means the deploy did not roll; \"dev\" means the VPS's" >&2
          echo "compose.yml predates MATCHPOINT_COMMIT; nothing means it never answered" >&2
          exit 1
        fi
        sleep 3
      done
      # The commit match above proves the API is up, not the web container;
      # a 502 here can still just be it settling, so give it the same grace.
      retry() { for i in 1 2 3; do "$@" && return 0; sleep 3; done; return 1; }

      # Caddy serves the SPA from the web container, built from the same
      # IMAGE_TAG the API just confirmed, so a 200 is all this has left to add.
      retry curl -fsS -o /dev/null "$site/"
      # A provider key that is present but wrong looks healthy until a coach
      # tries to sign up: /health cannot see it, and the test suite cannot
      # reach a provider by design. One real send per deploy catches it, and a
      # 502 here failing the deploy is the point — sign-up is bricked without
      # mail. delivered@resend.dev is Resend's delivery sink; they answer 422
      # to @example.com, which would read exactly like a bad key.
      #
      # Origin because a write without one is refused
      # (apps/api/src/matchpoint_api/csrf.py), which makes this the one place
      # the origin check is exercised through the real proxy chain: a 403 here
      # is that check answering Cloudflare and Caddy, not the key.
      retry curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' \
        -H "Origin: $site" \
        -d "{\"email\":\"delivered+$CI_PIPELINE_ID@resend.dev\"}" \
        "$site/api/auth/request-otp"

# Slack messages via an incoming-webhook URL in the (protected, masked)
# SLACK_WEBHOOK_URL variable; both jobs drop out of the pipeline entirely while
# that variable is unset or blank — a blank one would fail curl and redden an
# otherwise green pipeline.

.notify-base:
  stage: .post
  image: alpine:3.22
  before_script:
    - apk add --no-cache curl jq git
    # A commit title is arbitrary text, so neither layer of quoting can be done
    # by hand: jq builds the JSON, and this handles Slack's own markup, which
    # would otherwise swallow a title like "fix: strip <script> from notes".
    - |
      slack_escape() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
    # GITLAB_USER_NAME started the pipeline, CI_COMMIT_AUTHOR wrote the commit;
    # on a merge those are two different people, and the first is the one to ask
    # about a red main. Naming both when they agree is noise, hence the branch.
    - |
      author=$(printf '%s' "${CI_COMMIT_AUTHOR%% <*}" | slack_escape)
      who=$(printf '%s' "$GITLAB_USER_NAME" | slack_escape)
      [ "$author" = "$who" ] || who="$who (commit by $author)"
      summary="<$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|\`$CI_COMMIT_SHORT_SHA\`>"
      summary="$summary $(printf '%s' "$CI_COMMIT_TITLE" | slack_escape)"
    # How much landed in one go: CI_COMMIT_BEFORE_SHA is the ref's previous tip,
    # so a merge of five commits reads as five rather than as one. Silent at a
    # single commit, and silent again when the shallow clone doesn't reach back
    # far enough to answer — the count is a nicety, not worth a red pipeline.
    - |
      count=$(git rev-list --count "$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA" 2>/dev/null || true)
      if [ -n "$count" ] && [ "$count" -gt 1 ]; then
        summary="$summary · $count commits"
      fi
    # notify <colour> <headline> <context>. The headline sits outside the
    # attachment, and repeats as the message's own `text`, because Slack builds
    # the notification preview from those two and ignores attachment content.
    # What's left inside buys the colour bar down the side, which is what makes
    # the two outcomes tellable apart at a glance.
    - |
      notify() {
        jq -n --arg color "$1" --arg headline "$2" --arg summary "$summary" --arg context "$3" \
          '{text: ($headline | gsub("\\*"; "")),
            blocks: [{type: "section", text: {type: "mrkdwn", text: $headline}}],
            attachments: [{color: $color, blocks: [
              {type: "section", text: {type: "mrkdwn", text: $summary}},
              {type: "context", elements: [{type: "mrkdwn", text: $context}]}
            ]}]}' |
          curl -fsS --max-time 10 -H 'Content-Type: application/json' \
            --data @- "$SLACK_WEBHOOK_URL"
      }

notify-deploy-success:
  extends: .notify-base
  # smoke, not deploy: the ✅ claims production is serving this build, so it has
  # to wait on the job that establishes that. A smoke failure leaves this job
  # skipped and notify-pipeline-failure to do the talking.
  needs: [smoke]
  rules:
    - if: $SLACK_WEBHOOK_URL == null || $SLACK_WEBHOOK_URL == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - >
      notify "#2eb886" "*✅ Deployed to production*" "$who · <$CI_PIPELINE_URL|pipeline>"

# Deliberately no `needs`: a main pipeline that fails in lint, test or build
# never reaches the deploy job, and needing it would skip this job in exactly
# the cases worth announcing — a broken main. The cost of that is that nothing
# here knows which job failed: no predefined variable carries it, and
# CI_JOB_TOKEN is not accepted on the endpoint that lists a pipeline's jobs, so
# naming it would mean minting and rotating a read_api token. The link suffices.
notify-pipeline-failure:
  extends: .notify-base
  rules:
    - if: $SLACK_WEBHOOK_URL == null || $SLACK_WEBHOOK_URL == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure
  script:
    - >
      notify "#d40e0d" "*❌ main pipeline failed*" "$who · <$CI_PIPELINE_URL|pipeline>"

# The generic package registry has no equivalent of the container registry's
# cleanup policy, so prune it from the pipeline: keep the newest 10 image
# packages (the rollback window) and delete the rest. Scoped by package_name as
# well as type, so an unrelated generic package can't eat into that window.
# allow_failure because a failed prune must not mark a successful deploy
# pipeline red.
cleanup-packages:
  stage: .post
  image: alpine:3.22
  needs: [deploy]
  allow_failure: true
  rules:
    - if: $PACKAGES_CLEANUP_TOKEN == null || $PACKAGES_CLEANUP_TOKEN == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache curl jq
  script:
    # Deleting a package requires Maintainer and has no minimum-role setting to
    # lower, while CI_JOB_TOKEN carries the permissions of whoever triggered the
    # pipeline — so this prune only ran on a Maintainer's push and 403'd on a
    # Developer's. PACKAGES_CLEANUP_TOKEN is a project access token (api scope,
    # Maintainer) in a protected CI/CD variable, making it independent of who
    # pushed. It expires, so the rule above skips the job rather than failing it
    # once the variable is gone.
    - >-
      curl --fail-with-body -sS -H "PRIVATE-TOKEN: $PACKAGES_CLEANUP_TOKEN"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_type=generic&package_name=images&order_by=created_at&sort=desc&per_page=100"
      | jq -r '.[10:] | .[].id' | while read -r id; do curl --fail-with-body -sS -X DELETE -H
      "PRIVATE-TOKEN: $PACKAGES_CLEANUP_TOKEN"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/$id"; done
