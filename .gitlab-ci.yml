stages:
  - lint
  - test
  - build
  - deploy

# Let GitLab's "auto-cancel redundant pipelines" kill superseded runs when new
# commits land on the same ref.
default:
  interruptible: true

# Run on merge requests and on the default branch, but avoid duplicate pipelines
# for branches that already have an open merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# --- Shared job setup -------------------------------------------------------
# apps/api is a uv (Python) project; apps/web is a pnpm workspace member. The two
# toolchains never touch each other, hence two independent job families.

.api-base:
  # The 0.11 minor pin matches pyproject's uv required-version; the unversioned
  # *-bookworm-slim tags are frozen at uv 0.9, which can't read this lockfile.
  image: ghcr.io/astral-sh/uv:0.11-python3.12-trixie-slim
  variables:
    # Absolute, because before_script cds into apps/api while cache:paths are
    # resolved from the repo root — a relative path caches a directory that the
    # jobs never write to.
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  cache:
    key:
      files:
        - apps/api/uv.lock
    paths:
      - .uv-cache
  before_script:
    - cd apps/api
    - uv sync --locked --group dev
  # Root config files affect both families and so appear in both filters.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - apps/api/**/*
        - .gitlab-ci.yml

# Narrower than .web-base's filter on purpose. That list is sized for repo-wide
# Prettier/ESLint, which has to see a Markdown edit anywhere in the repo; these
# rules are for the jobs that only compile and run web app code, and nothing
# left out of them can change web runtime behaviour. web-lint still runs on the
# broad list, so repo-wide formatting stays enforced.
.web-app-rules: &web-app-rules
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - changes:
      - apps/web/**/*
      - packages/**/*
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .gitlab-ci.yml

.web-base:
  image: node:22-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    # Moves the store inside the project so cache:paths above can archive it.
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Prettier and ESLint run repo-wide from the root, so this list has to name
    # every file Prettier formats, not just web source — Markdown, YAML and JSON
    # anywhere in the repo included. A violation that skips web-lint merges
    # unchecked and then fails the next pipeline that does run one.
    - changes:
        - apps/web/**/*
        - packages/**/*
        - docs/**/*
        - infra/**/*
        - "**/*.md"
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - skills-lock.json
        - eslint.config.mjs
        - .prettierrc.json
        - .prettierignore
        - .editorconfig
        - .mcp.json
        - docker-compose.yml
        - .gitlab-ci.yml

# --- Jobs -------------------------------------------------------------------
# `needs:` makes this a DAG rather than a stage ladder, so the two families run
# as independent chains and every lint and test job starts at once. The `stages:`
# list above is then ordering documentation that keeps the pipeline graph
# readable, not a barrier.
#
# Note where the lint jobs sit: nothing depends on them until the image builds.
# A job with `needs:` runs as soon as its own needs are satisfied, regardless of
# what else in the pipeline failed, so hanging lint off the builds rather than
# off the test jobs is what keeps a failing lint from reaching deploy — while
# still letting the slow e2e job start immediately instead of queueing behind
# repo-wide Prettier.
#
# The build jobs' `needs:` use the `optional: true` long form because `rules:`
# lets jobs drop out independently, and a hard `needs:` on a job that was never
# created is a pipeline-config error rather than a skip.

python-lint:
  extends: .api-base
  stage: lint
  needs: []
  script:
    - uv run ruff check .
    - uv run ruff format --check .

web-lint:
  extends: .web-base
  stage: lint
  needs: []
  script:
    - pnpm run format:check
    - pnpm run lint

api-test:
  extends: .api-base
  stage: test
  needs: []
  variables:
    # Absolute for the same reason as UV_CACHE_DIR. pyright on PyPI is a shim
    # that downloads a Node build and npm-installs the real pyright into this
    # directory on first run, so caching it is worth more than caching uv's.
    PYRIGHT_PYTHON_ENV_DIR: $CI_PROJECT_DIR/.pyright-node
  # Spelled out rather than inherited: cache: is a list, so extends replaces it
  # wholesale. The uv entry is pull-only — python-lint already pushes it under
  # the same key — while the pyright env is only ever produced here. Keying it on
  # uv.lock invalidates it whenever the pyright pin moves.
  cache:
    - key:
        files:
          - apps/api/uv.lock
      paths:
        - .uv-cache
      policy: pull
    - key:
        prefix: pyright-node
        files:
          - apps/api/uv.lock
      paths:
        - .pyright-node
  script:
    # The Node build pyright fetches links against libatomic; ruff is a static
    # binary and doesn't, so this stays out of .api-base and off python-lint.
    - apt-get update -qq && apt-get install -y -qq libatomic1 > /dev/null
    - uv run pyright
    - uv run pytest --cov --junitxml=junit.xml
  # Matches the TOTAL line of pytest-cov's terminal report.
  coverage: '/TOTAL.*? (\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: apps/api/junit.xml

web-test:
  extends: .web-base
  stage: test
  needs: []
  rules: *web-app-rules
  # Pull-only: web-lint pushes this cache under the same lockfile-derived key,
  # so re-archiving the store here would upload nothing new. cache: is a map, so
  # extends merges this in on top of .web-base's key and paths.
  cache:
    policy: pull
  script:
    - pnpm run typecheck
    # Called via --filter rather than the root `test` script because the extra
    # `--recursive` layer swallows the reporter flags.
    - pnpm --filter @matchpoint/web run test --reporter=default --reporter=junit
      --outputFile=junit.xml --coverage
  # Matches the Statements line of the "Coverage summary" block, which the
  # text-summary reporter emits (enabled in apps/web/vite.config.ts).
  coverage: '/Statements\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    reports:
      junit: apps/web/junit.xml

web-e2e:
  extends: .web-base
  stage: test
  # needs: [] deliberately — this is the longest job in the pipeline, so it
  # starts at t=0 rather than waiting for a lint stage it has no dependency on.
  needs: []
  rules: *web-app-rules
  cache:
    policy: pull
  # The image tag must track @playwright/test in pnpm-lock.yaml. It ships the
  # browser builds that release expects, which is what the suite runs against:
  # pnpm doesn't execute the playwright postinstall that would otherwise
  # download them, so a mismatched tag fails looking for a browser revision the
  # image doesn't carry.
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  script:
    - pnpm --filter @matchpoint/web run test:e2e
  artifacts:
    when: always
    # The HTML report is the point of a failed e2e run — it carries the traces
    # retries record, which the JUnit summary alone can't show.
    paths:
      - apps/web/playwright-report/
    reports:
      junit: apps/web/junit-e2e.xml

# --- Build & deploy ----------------------------------------------------------
# Image builds talk to the ThinkTank host's Docker daemon through the socket
# the runner mounts into job containers, so the layer cache persists between
# runs. Shipping and deploying are default-branch only; each image is uploaded
# as a docker-save tarball to the generic package registry (package "images",
# version = commit short SHA) — the container registry port (5050) is
# firewalled to campus-internal traffic, while the package registry rides the
# reachable HTTPS port. The tarball is written to disk before the upload so
# curl sends a Content-Length instead of a chunked body, and `docker save` and
# `gzip` are separate steps rather than a pipeline: the job runs under sh with
# no pipefail, so piping would report gzip's status and upload a truncated
# tarball with the job green.

.image-base:
  stage: build
  image: docker:29-cli
  variables:
    PUSH_IMAGE: "true"

# Each build job spells out its own rules rather than sharing one on .image-base:
# the changes: list is per-image, so an apps/api commit doesn't rebuild the web
# image, and rules: is a list, which extends replaces rather than merges.
#
# Off the default branch, each builds without pushing whenever its own inputs
# change, so a broken build fails on the merge request instead of first being
# noticed as a main pipeline that leaves main undeployable. The whole of each app
# is an input, not just its Dockerfile: a bad import, a new dependency, or a
# lockfile bump breaks the build with the Dockerfile untouched.

build-api-image:
  extends: .image-base
  needs:
    - job: python-lint
      optional: true
    - job: api-test
      optional: true
  # No root .dockerignore here: the build context is apps/api, so Docker reads
  # apps/api/.dockerignore, which apps/api/**/* already covers.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - apps/api/**/*
        - .gitlab-ci.yml
      variables:
        PUSH_IMAGE: "false"
  script:
    - docker build -t "matchpoint/api:$CI_COMMIT_SHORT_SHA" apps/api
    # CI_JOB_TOKEN is scoped to this pipeline run; no stored secret involved.
    - >-
      if [ "$PUSH_IMAGE" = "true" ]; then apk add --no-cache curl && docker save -o api.tar
      "matchpoint/api:$CI_COMMIT_SHORT_SHA" && gzip api.tar && curl --fail-with-body -sS -H
      "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file api.tar.gz
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/images/$CI_COMMIT_SHORT_SHA/api.tar.gz";
      fi

build-web-image:
  extends: .image-base
  needs:
    - job: web-lint
      optional: true
    - job: web-test
      optional: true
    - job: web-e2e
      optional: true
  # This image builds from the repo root, so the workspace manifests and the root
  # .dockerignore are inputs too.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - apps/web/**/*
        - packages/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - .dockerignore
        - .gitlab-ci.yml
      variables:
        PUSH_IMAGE: "false"
  script:
    - docker build -f apps/web/Dockerfile -t "matchpoint/web:$CI_COMMIT_SHORT_SHA" .
    - >-
      if [ "$PUSH_IMAGE" = "true" ]; then apk add --no-cache curl && docker save -o web.tar
      "matchpoint/web:$CI_COMMIT_SHORT_SHA" && gzip web.tar && curl --fail-with-body -sS -H
      "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file web.tar.gz
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/images/$CI_COMMIT_SHORT_SHA/web.tar.gz";
      fi

deploy:
  stage: deploy
  image: alpine:3.22
  # Not optional, unlike the needs above: this job is default-branch-only, where
  # both builds always run, so a soft edge could only ever let a deploy fire for
  # a SHA whose tarball was never uploaded. Fail the pipeline instead.
  needs: [build-api-image, build-web-image]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Never auto-cancel a deploy mid-flight, and never run two concurrently.
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: https://matchpoint.thomaskabalin.com
  before_script:
    - apk add --no-cache openssh-client
  script:
    - chmod 600 "$SSH_PRIVATE_KEY"
    # The key is bound to a forced command on the VPS (infra/prod/deploy.sh),
    # so the "command" sent here is just the image tag to deploy. SSH goes to
    # the IP because the domain resolves to Cloudflare, not the origin.
    - ssh -i "$SSH_PRIVATE_KEY" -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" deploy@REDACTED
      "$CI_COMMIT_SHORT_SHA"

# Slack messages via an incoming-webhook URL in the (protected, masked)
# SLACK_WEBHOOK_URL variable; both jobs drop out of the pipeline entirely while
# that variable is unset or blank — a blank one would fail curl and redden an
# otherwise green pipeline.

.notify-base:
  stage: .post
  image: curlimages/curl:8.18.0

notify-deploy-success:
  extends: .notify-base
  needs: [deploy]
  rules:
    - if: $SLACK_WEBHOOK_URL == null || $SLACK_WEBHOOK_URL == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - >
      curl -fsS --max-time 10 -H 'Content-Type: application/json' --data "{\"text\": \"✅ Deployed
      $CI_COMMIT_SHORT_SHA to https://matchpoint.thomaskabalin.com — $CI_PIPELINE_URL\"}"
      "$SLACK_WEBHOOK_URL"

# Deliberately no `needs`: a main pipeline that fails in lint, test or build
# never reaches the deploy job, and needing it would skip this job in exactly
# the cases worth announcing — a broken main.
notify-pipeline-failure:
  extends: .notify-base
  rules:
    - if: $SLACK_WEBHOOK_URL == null || $SLACK_WEBHOOK_URL == ""
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_failure
  script:
    - >
      curl -fsS --max-time 10 -H 'Content-Type: application/json' --data "{\"text\": \"❌ main
      pipeline for $CI_COMMIT_SHORT_SHA failed — $CI_PIPELINE_URL\"}" "$SLACK_WEBHOOK_URL"

# The generic package registry has no equivalent of the container registry's
# cleanup policy, so prune it from the pipeline: keep the newest 10 image
# packages (the rollback window) and delete the rest. Scoped by package_name as
# well as type, so an unrelated generic package can't eat into that window.
# allow_failure because a failed prune must not mark a successful deploy
# pipeline red.
cleanup-packages:
  stage: .post
  image: alpine:3.22
  needs: [deploy]
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache curl jq
  script:
    # If the instance refuses JOB-TOKEN for the packages API, swap both headers
    # for "PRIVATE-TOKEN: $PACKAGES_CLEANUP_TOKEN" backed by a project access
    # token (api scope, Maintainer) in a protected CI/CD variable.
    - >-
      curl --fail-with-body -sS -H "JOB-TOKEN: $CI_JOB_TOKEN"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_type=generic&package_name=images&order_by=created_at&sort=desc&per_page=100"
      | jq -r '.[10:] | .[].id' | while read -r id; do curl --fail-with-body -sS -X DELETE -H
      "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/$id"; done
