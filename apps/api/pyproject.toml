[project]
name = "matchpoint-api"
version = "0.1.0"
description = "MatchPoint API"
requires-python = ">=3.12"
dependencies = [
    # standard-no-fastapi-cloud-cli is the standard extra minus fastapi-cloud-cli
    # (and its sentry-sdk dependency), which we have no use for — we deploy to our
    # own VPS, not FastAPI Cloud.
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    # Already in the tree as a fastapi[standard] extra, declared here because mail.py
    # imports it directly — a dependency we call is not one to inherit by accident.
    "httpx>=0.28",
    "structlog>=26.1.0",
    # Decodes and re-encodes uploaded photos (photos.py). Wheels are prebuilt, so the
    # runtime image needs no build toolchain for it.
    "pillow>=12.3.0",
    # Nothing imports it, but File() parts are unreadable without it: FastAPI raises at
    # import when a route declares one and it is missing. Declared for httpx's reason
    # above — a dependency the routes rely on is not one to inherit by accident.
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.3",
    "pyright>=1.1.390",
    # starlette.testclient prefers httpx2 and warns when falling back to httpx.
    "httpx2>=2.9",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# Floor is the lowest uv we have actually verified against this project. uv.lock is
# at revision 3, which older uv versions cannot read; this turns that into a clear
# error instead of a confusing parse failure.
required-version = ">=0.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchpoint_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, flake8-simplify, flake8-tidy-imports,
# flake8-bandit (S608: possible SQL injection via string-built query)
select = ["E", "F", "I", "UP", "B", "SIM", "TID251", "S608"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.text".msg = "Raw SQL bypasses the ORM's parameterisation. Use the ORM's expression language (select/filter/etc) instead."

[tool.ruff.lint.per-file-ignores]
# Alembic migrations use sa.text() for DDL column/server defaults, not query building.
"tests/**" = ["TID251", "S608"]
"migrations/**" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/matchpoint_api"]
# Statement coverage alone counts an `if` as covered once either arm runs, which
# will start to matter as the analytics queries grow branches worth missing.
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
