<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- MatchPoint is a private coaching tool — keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>MatchPoint</title>
    <meta
      name="description"
      content="Track live tennis match statistics and analyse player performance."
    />

    <!-- color-scheme stops the browser auto-darkening the canvas, form controls and
         scrollbars in the theme we're not in. Both this and theme-color are set by
         the script below, matched to the coach's own stored choice rather than the
         OS preference (#182, #200) — there is no media-query variant of either
         left, since the browser must never decide this on its own. -->
    <meta name="color-scheme" content="light" id="color-scheme-meta" />
    <meta name="theme-color" content="#ffffff" id="theme-color-meta" />

    <!-- Sets .dark on <html> from the coach's stored choice before first paint —
         run inline and synchronously so there's no flash of the wrong theme while
         main.tsx loads. Deliberately duplicated from src/lib/theme.ts's own
         resolve logic (kept in sync by hand): this has to run before any module
         loads, so it can't import that file. No matchMedia read anywhere — light
         and dark are decided solely by localStorage, defaulting to light.

         Dark mode is deactivated (Settings' own toggle is gone, see
         settings-app.tsx): this always resolves "light" rather than trusting a
         stored "dark" value some coach picked before that shipped, the same
         reasoning theme.ts's own readStoredTheme now applies. -->
    <script>
      (function () {
        var theme = "light";
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.getElementById("color-scheme-meta").setAttribute("content", theme);
        document
          .getElementById("theme-color-meta")
          .setAttribute("content", theme === "dark" ? "#090B0C" : "#ffffff");
      })();
    </script>

    <!-- A tab-sized simplification of the mark, not the icon.svg the PNGs come from —
         the full one's service lines smear together at 16px. SVG so it stays sharp at
         whatever size the browser asks for, and small enough to be worth fetching on
         every first visit. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- iOS ignores the manifest's icons when installing to the home screen and reads
         this instead, so it has to be linked by hand. The manifest itself is injected
         by vite-plugin-pwa at build time. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
