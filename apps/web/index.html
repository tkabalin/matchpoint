<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- MatchPoint is a private coaching tool — keep it out of search results. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>MatchPoint</title>
    <meta
      name="description"
      content="Track live tennis match statistics and analyse player performance."
    />

    <!-- color-scheme stops the browser auto-darkening the canvas, form controls and
         scrollbars; theme-color matches --background in src/app.css. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
