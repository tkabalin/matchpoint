services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: matchpoint
      POSTGRES_PASSWORD: matchpoint
      POSTGRES_DB: matchpoint
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchpoint"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
